name: Performance Gate

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    name: Build & Mobile Performance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build app
        run: npm run build

      - name: Run mobile performance gate
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
          PSI_TARGET_LCP_SECONDS: "7"
          PSI_TARGET_CLS: "0.4"
        run: |
          if [ -z "$PSI_API_KEY" ]; then
            echo "::error::PSI_API_KEY secret is missing."
            echo "Set it in GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi

          npm run audit:mobile:ci